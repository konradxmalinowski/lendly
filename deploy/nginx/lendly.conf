# Lendly web front: static Angular build and /api reverse proxy. __WEB_HOST__ and __API_HOST__ are replaced by deploy.sh.
server {
    # Nginx 1.24 (Ubuntu 24.04) uses the listen parameter; the separate http2 directive needs 1.25+.
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/ssl/lendly/lendly.crt;
    ssl_certificate_key /etc/ssl/lendly/lendly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lendly:10m;

    root /var/www/lendly/current;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    # Optional: when a TLS-terminating proxy sits in front of this server, trust its X-Forwarded-For header.
    # deploy.sh fills in TRUSTED_PROXY from hosts.env and removes both lines when it is empty.
    set_real_ip_from __TRUSTED_PROXY__;
    real_ip_header X-Forwarded-For;

    # Browsers ignore HSTS on IP addresses, so the self-signed IP access is unaffected; the public domain has a trusted certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://__API_HOST__:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts exactly one forwarded address from this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    # Service worker and its helpers must always be revalidated, or clients keep running a stale worker.
    location ~ ^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|woff2?)$ {
        # Module workers are rejected unless .mjs is served as JavaScript; Ubuntu's mime.types lacks it.
        types { text/javascript js mjs; text/css css; font/woff2 woff2; font/woff woff; }
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Unhashed icons: allow a week of caching (the catch-all below sends no-cache, which would revalidate them on every visit).
    location ~* ^/(?:icons/[^/]+\.png|favicon[^/]*\.(?:svg|png)|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Listings sitemap is generated by the API from active listings.
    location = /sitemap-listings.xml {
        proxy_pass http://__API_HOST__:8080/api/seo/sitemap-listings.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    # Listing pages: SSI pulls the listing's title, description, photo and JSON-LD into <head> for crawlers and link
    # previews (listing.html is built by deploy.sh). If the API does not answer, the default tags are used.
    location ~ "^/items/(?<listing_id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/?$" {
        ssi on;
        ssi_silent_errors on;
        try_files /listing.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Client-rendered routes of the app. Anything else that is not a file gets a real 404 with the app's not-found page.
    location ~ "^/(?:login(?:/mfa)?|register|verify-email|profile|missions|moderation(?:/reports/[^/]+)?|reservations(?:/[^/]+)?|account/listings|privacy|terms|listings/(?:new|[^/]+/edit))/?$" {
        try_files /index.csr.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        # Prerendered pages (/ and /items) and static files; unknown paths keep the 404 status and show the app shell.
        try_files $uri $uri/index.html =404;
        error_page 404 /index.csr.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
